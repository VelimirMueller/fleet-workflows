# fleet.yml (VelimirMueller/fleet-standard, STANDARD.md). Tier library: this repo ships code that
# callers run (reusable workflows, composite actions, the fleet-check JS action), released as tags.
# All reusable workflows start with `_`, so it needs no publisher role (WF-PUB-01).
tier: library
visibility: public
exceptions:
  - rule: CI-STAGE-04
    value: []
    reason: The self-test calls its own lint stage at the PR commit; a tag pin would test the last release.
