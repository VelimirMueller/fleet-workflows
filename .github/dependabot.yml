# Weekly, grouped action updates (CI-COST-04). A merged update needs a new tag before callers get it.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
