    rule: Moved to CI-COST-12.
    moved_to: CI-COST-12
  - id: WF-TRIG-02
    rule: Moved to CI-COST-19.
    moved_to: CI-COST-19
  - id: WF-TRIG-03
    rule: Moved to CI-COST-19.
    moved_to: CI-COST-19
  - id: WF-TRIG-04
    rule: Moved to CI-COST-10.
    moved_to: CI-COST-10
