name: fleet-check
description: >-
  Run `fleet check` (the fleet standard conformance check) on the checked-out repo. On a
  pull_request it diffs the merge commit against its base (checkout with fetch-depth 2) and passes
  at once only when the PR changes nothing but documents or images outside the checked paths.
  dist/, rules/ and schema/ are generated by `pnpm bundle:action` in VelimirMueller/fleet-standard
  (private). Do not edit them here.

inputs:
  strict:
    description: true also fails on SHOULD findings.
    required: false
    default: 'false'
  path:
    description: Repo directory, relative to the workspace.
    required: false
    default: .

runs:
  using: node24
  main: dist/index.min.js
