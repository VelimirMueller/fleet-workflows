name: tf-check
description: >-
  Terraform static checks without credentials (CI-LINT-04): fmt, init without a backend, validate,
  tflint and trivy config. Used by `_tf-check.yml` and by `_ci-lint.yml` with `terraform: true`.

inputs:
  working-directory:
    description: Terraform root module directory (TF-LAYOUT-01).
    required: false
    default: terraform

runs:
  using: composite
  steps:
    - name: Read the pinned Terraform version
      id: version
      env:
        DIR: ${{ inputs.working-directory }}
      shell: bash
      run: |
        file="$DIR/.terraform-version"
        [ -s "$file" ] || { echo "::error::$file is missing (TF-LAYOUT-06)"; exit 1; }
        echo "version=$(tr -d '[:space:]' < "$file")" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false

    - name: Check the Terraform format
      env:
        DIR: ${{ inputs.working-directory }}
      shell: bash
      run: terraform -chdir="$DIR" fmt -check -recursive

    - name: Validate without a backend
      env:
        DIR: ${{ inputs.working-directory }}
      shell: bash
      run: |
        terraform -chdir="$DIR" init -backend=false -input=false -lockfile=readonly
        terraform -chdir="$DIR" validate

    - name: Install tflint
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.64.0

    - name: Run tflint
      env:
        DIR: ${{ inputs.working-directory }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        config=()
        if [ -f "$GITHUB_WORKSPACE/.tflint.hcl" ]; then config=(--config "$GITHUB_WORKSPACE/.tflint.hcl"); fi
        cd "$GITHUB_WORKSPACE/$DIR" || exit 1
        tflint "${config[@]}" --init
        tflint "${config[@]}" --recursive --format compact

    - name: Scan the Terraform with trivy
      env:
        DIR: ${{ inputs.working-directory }}
      shell: bash
      run: docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" aquasec/trivy:0.76.1 config --exit-code 1 --severity HIGH,CRITICAL "/src/$DIR"
